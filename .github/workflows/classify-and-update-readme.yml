name: Classify new solutions & update README

# Runs on every push to main. The script itself figures out whether there
# are any new top-level folders/files not yet in topics.json -- if there
# aren't, it's a no-op and nothing gets committed.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: classify-readme
  cancel-in-progress: false

jobs:
  update-topics:
    runs-on: ubuntu-latest
    # Don't re-trigger on the bot's own commit (avoids an infinite loop)
    if: ${{ !contains(github.event.head_commit.message, '[skip-readme-bot]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Classify new folders and regenerate README
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GITHUB_REPO_NAME: ${{ github.event.repository.name }}
          GITHUB_DEFAULT_BRANCH: main
          GROQ_MODEL: llama-3.1-8b-instant
        run: python scripts/update_topics.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add topics.json README.MD
          if ! git diff --cached --quiet; then
            git commit -m "chore: auto-classify new solutions and update README [skip-readme-bot]"
            git push
          else
            echo "Nothing to commit."
          fi
